name: Build Windows Installer (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        id: install
        run: npm install
        continue-on-error: false

      - name: Handle Install Failure
        if: failure() && steps.install.outcome == 'failure'
        run: echo "::error::Dependency installation failed. Check package-lock.json consistency."

      - name: Build Web Application
        id: build_web
        run: npm run build
        continue-on-error: false

      - name: Handle Build Failure
        if: failure() && steps.build_web.outcome == 'failure'
        run: echo "::error::Vite build failed. Check for typescript or linting errors."

      - name: Build & Package Windows App
        id: package
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
          args: --win nsis --x64
        continue-on-error: false

      - name: Verify Build Artifacts
        if: success()
        shell: bash
        run: |
          if [ ! -d "dist-electron" ]; then
            echo "::error::Build directory dist-electron not found!"
            exit 1
          fi
          echo "Build successful. Checking for .exe files..."
          ls -R dist-electron/*.exe || echo "No .exe found in dist-electron root, checking subdirectories..."

      - name: Handle Packaging Failure
        if: failure() && steps.package.outcome == 'failure'
        run: echo "::error::Electron packaging failed. Check electron-builder configuration in package.json."
